name: Build Wheels
description: Builds Python wheels across specified architectures using cibuildwheel and uploads them.
inputs:
  python-version:
    description: Python version to set up
    required: true
  cibw-arch:
    description: Architecture to pass to cibuildwheel
    required: true
  artifact-name:
    description: Name of the uploaded artifact
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
    - name: Build wheels
      shell: bash
      run: |
        uvx --with 'cibuildwheel>=2.16.0,<4.0.0' cibuildwheel --output-dir wheelhouse
      env:
        CIBW_ARCHS: ${{ inputs.cibw-arch }}
        CIBW_SKIP: 'pp*'
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: wheelhouse/*.whl
