name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
      
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          # Full history so a future `cs-coverage check` can reach the
          # pull request's merge base (see the deferred gate note below).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: '1.95.0'
          cache: false

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          uv tool install nixie-cli==1.1.0

      - name: Install Merman CLI
        run: cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Check spelling
        run: make spelling

      - name: Check Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check Mermaid diagrams
        run: make nixie

      - name: Audit dependencies
        run: make audit

      # Coverage runs on pull requests only. Pushes to main upload their
      # own coverage (and advance the ratchet baseline) via
      # coverage-main.yml, so generating it here as well would duplicate
      # the work and the CodeScene upload for the same commit.
      - name: Test and Measure Coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: leynos/shared-actions/.github/actions/generate-coverage@0e3c4d24e43aa48b511d94f3b902711eb02138df
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: typos-config-builder
          with-ratchet: 'true'
          baseline-python-file: .coverage-baseline.typos-config-builder.python
          
      # The changed-line `cs-coverage check` gate is deliberately not wired
      # in yet: CodeScene rejects `cs-coverage check` for any project whose
      # coverage-gates configuration is absent ("Lacks the gates
      # configuration."), which is a CodeScene-side, per-project setting
      # rather than a CI defect. Once this repo is onboarded to CodeScene
      # — set the `codescene_project_id` copier answer — and coverage-main.yml
      # has uploaded to main at least once, add a `mode: check` step guarded
      # on `CS_ACCESS_TOKEN != ''` with the project's
      # `project-url: https://api.codescene.io/v2/projects/<id>`.
