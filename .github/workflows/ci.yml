name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. A push
    # to main runs here too, so main writes the Ubicloud cache scope this
    # reads; coverage-main.yml's coverage-upload is on the same class.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # An Ubicloud runner is a self-hosted just-in-time runner with no
    # six-hour hosted cap, so the job states its own ceiling: twice the 5.1 min
    # of the first Ubicloud main run (run 36708777716), rounded up to 15.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: '1.95.0'
          cache: false

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          uv tool install nixie-cli==1.1.0

      - name: Install Merman CLI
        run: cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@b9a3bff63b1e19b3a48d433668184e24e1abd3ba
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts

      - name: Check spelling
        run: make spelling

      - name: Check Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check Mermaid diagrams
        run: make nixie

      - name: Audit dependencies
        run: make audit

      # Coverage runs on pull requests only, ratcheting against the
      # baseline coverage-main.yml writes on pushes to main; that workflow
      # is also the only one that uploads to CodeScene. Nothing here
      # publishes the report.
      - name: Test and Measure Coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: leynos/shared-actions/.github/actions/generate-coverage@d4d248bbbecdcf7b4f5bc79ffd4d6caee370bd79
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: typos-config-builder
          with-ratchet: 'true'
          publish-artefact: 'false'
          baseline-python-file: .coverage-baseline.typos-config-builder.python
          python-source: ./typos_config_builder
