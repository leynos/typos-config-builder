name: Coverage (main)

# The single CodeScene publisher. CodeScene accepts `cs-coverage upload`
# only for analysed branches, so main's coverage is uploaded here on
# push. Pull requests generate coverage with the ratchet this workflow
# advances, and nothing a pull request runs receives CodeScene
# credentials or contacts CodeScene. tests/test_codescene_coverage_contract.py
# holds the shape.
#
# `workflow_dispatch` is mandatory, not a convenience: merges performed by
# the automerge workflow's GITHUB_TOKEN do not fire push-event workflows,
# so automerged changes to main only receive coverage via a manual
# dispatch. A dispatch can aim at any branch, which is why the upload step
# is guarded on the ref as well as the token.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run per ref at a time, never cancelled. GitHub keeps one
# pending run per group, so a newer push replaces an older pending run
# and never interrupts a running one; the newest baseline wins. A
# cancelled run would abandon both its upload and its ratchet baseline
# write. The group is keyed on the ref so that a dispatch from another
# branch cannot displace a pending main run and then skip the upload,
# and on the event so that a dispatch on main cannot displace a pending
# push, which is the only run that writes the baseline.
concurrency:
  group: coverage-main-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: typos-config-builder
          with-ratchet: 'true'
          baseline-python-file: .coverage-baseline.typos-config-builder.python

      - name: Upload coverage data to CodeScene
        # The token binds here and nowhere else in the workflow.
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          # No checksum input: the action pins the CLI through its own
          # manifest, and `installer-checksum` is rejected from this pin.
