name: Coverage (main)

# The single CodeScene publisher. CodeScene accepts `cs-coverage upload`
# only for analysed branches, so main's coverage is uploaded here on
# push. Pull requests generate coverage with the ratchet this workflow
# advances, and nothing a pull request runs receives CodeScene
# credentials or contacts CodeScene. `cv005-contracts` (the Makefile's
# `test-workflow-contracts` target) holds the shape.
#
# `workflow_dispatch` is mandatory, not a convenience: merges performed by
# the automerge workflow's GITHUB_TOKEN do not fire push-event workflows,
# so automerged changes to main only receive coverage via a manual
# dispatch. A dispatch can aim at any branch, which is why the upload step
# is guarded on the ref as well as the token.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run per ref at a time, never cancelled. GitHub keeps one
# pending run per group, so a newer push replaces an older pending run
# and never interrupts a running one; the newest baseline wins. A
# cancelled run would abandon both its upload and its ratchet baseline
# write. The group is keyed on the ref alone: a branch dispatch cannot
# displace a pending main run, and with one group for main, runs never
# overlap and the newest triggered run's coverage lands last. A manual
# re-run of an older run is an operator action that republishes that
# commit's coverage and baseline until the next push. A dispatch that
# replaces a pending push leaves the ratchet baseline one commit behind
# until the next push, because only a push saves it.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # Coverage upload on main blocks no one's work, so it runs on a
    # GitHub-hosted runner rather than a paid Ubicloud one.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene_environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@c444bcb1180d5a9e7cc01db2c81e108fd50f26f7
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: typos-config-builder
          with-ratchet: 'true'
          baseline-python-file: .coverage-baseline.typos-config-builder.python
          python-source: ./typos_config_builder
          # This job runs on a GitHub-hosted runner, whose cache store the
          # Ubicloud pull-request lane never reads, so a ratchet here could
          # not fail and a save here would never be restored. `never` skips
          # both and hands the figure to `coverage-baseline` below.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover

      # Whether the token is set, as a plain output. The expression is
      # evaluated before the shell runs, so this step binds nothing: the
      # token is in no step's env, because the upload action is composite
      # and passes its step env to nested upload-artifact and cache steps.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        if: >-
          steps.codescene-token.outputs.available == 'true'
          && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@c444bcb1180d5a9e7cc01db2c81e108fd50f26f7
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          # No checksum input: the action pins the CLI through its own
          # manifest, and `installer-checksum` is rejected from this pin.

  # Ratchets the figure `coverage-upload` handed over and saves the baseline
  # the Ubicloud pull-request lane restores. It runs only if the coverage job
  # passed, so the baseline never advances from a failed run, and it compiles
  # nothing. It carries no `if`: the action publishes only from a push.
  coverage-baseline:
    needs: coverage-upload
    # The estate's selection expression, as ci.yml writes it: this
    # repository's placement contract requires it of every Ubicloud lane,
    # though a push-only workflow can never take the hosted arm.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@c444bcb1180d5a9e7cc01db2c81e108fd50f26f7
        with:
          artefact-name: coverage-baseline-handover
          baseline-python-file: .coverage-baseline.typos-config-builder.python
