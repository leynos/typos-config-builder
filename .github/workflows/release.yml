name: Release Wheels

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  pure-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.14'
          artifact-name: wheels-pure

  release:

    # This project has no C or Rust extensions, so cross-platform
    # builds are unnecessary. Only the pure Python wheel is published.

    needs:

      - pure-wheel

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-pure
          path: dist
      - name: Upload wheels to release
        # Name the artifact so a missing one fails the download, search all of
        # dist rather than assuming where the download put it, and fail when
        # nothing was found. The previous dist/wheels-* glob matched nothing,
        # so v0.1.0 to v0.1.4 were published without a wheel while this step
        # still reported success.
        run: |
          set -eu
          mapfile -d '' wheels < <(find dist -type f -name '*.whl' -print0)
          if (( ${#wheels[@]} == 0 )); then
            echo "no wheel found under dist" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${wheels[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
