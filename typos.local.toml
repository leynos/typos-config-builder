# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  'Center \| Microsoft Learn',
  # Inline code quotes external API identifiers that keep US spelling. The
  # shared dictionary gains this pattern in EP-M7; remove it here afterwards.
  '`[^`\n]+`',
]

[files]
# The packaged snapshot is a policy document: it lists the prohibited
# phrases themselves, so scanning it would report shared policy as a
# finding. Consumers never carry this file.
exclude = ["typos_config_builder/data/typos-oxendict-base.toml"]
